# Rebuilds the calendar every morning and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Build calendar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *"   # 6 am Denver (MDT), 5 am in winter
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          # Custom domain (set in the repo's Pages settings and DNS)
          URL="https://milehigh.bike/"
          python3 build.py --site-url "$URL"
      - name: Save feed cache
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add data/cache
          git diff --cached --quiet || git commit -m "Update feed cache" && git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
